services:
  # ----------------------------
  # Backend Service (FastAPI)
  # ----------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Maps your local backend folder to the container for hot-reloading
      - ./backend:/app
      # Prevent the container's venv/pycache from overwriting yours
      - /app/__pycache__
    environment:
      - PORT=8000
    restart: always

  # ----------------------------
  # Frontend Service (Vite + React)
  # ----------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # Maps local folder to container for hot-reloading
      - .:/app
      # Isolate node_modules so container uses its own Linux binaries
      - /app/node_modules
    environment:
      # Tell Vite where the API is
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1300